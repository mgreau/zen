name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Diff coverage needs the merge base, which a shallow clone lacks.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -coverprofile=coverage.out -covermode=count

      - name: Lint
        run: go vet ./...

      # Whole-project coverage lets a well-covered core hide an untested new
      # feature. This gates only the lines the pull request adds.
      - name: Diff coverage
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          python3 scripts/diffcover.py \
            --profile coverage.out \
            --base "origin/$GITHUB_BASE_REF" \
            --min 75
